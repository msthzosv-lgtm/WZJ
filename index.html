<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .game {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        padding: 20px;
        background: #1e293b;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }
      canvas {
        border: 2px solid #334155;
        background: #020617;
      }
      .panel { width: 190px; }
      .panel h1 { margin: 0 0 12px; font-size: 20px; }
      .info { margin-bottom: 10px; line-height: 1.6; }
      .kbd {
        display: inline-block;
        margin-right: 4px;
        margin-bottom: 4px;
        padding: 2px 6px;
        border: 1px solid #475569;
        border-radius: 6px;
        background: #0f172a;
        font-size: 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;
        color: #0f172a;
        background: #22d3ee;
        cursor: pointer;
      }
      .controls {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .controls button {
        padding: 8px;
        color: #e2e8f0;
        background: #334155;
      }
      .hint { opacity: 0.9; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="game">
      <canvas id="board" width="480" height="480"></canvas>
      <div class="panel">
        <h1>贪吃蛇</h1>
        <div class="info">分数: <span id="score">0</span></div>
        <div class="info">长度: <span id="length">1</span></div>
        <div class="info">速度: <span id="speed">8</span> 格/秒</div>
        <div class="info">
          <div><span class="kbd">↑↓←→</span> 控制方向</div>
          <div><span class="kbd">P</span> 暂停/继续</div>
          <div><span class="kbd">R</span> 重新开始</div>
        </div>
        <button id="restart">重新开始</button>
        <div class="controls">
          <button data-action="up">↑</button>
          <button data-action="pause">暂停</button>
          <button data-action="right">→</button>
          <button data-action="left">←</button>
          <button data-action="down">↓</button>
          <button data-action="restart">重开</button>
        </div>
        <p class="hint">吃到红色豆豆会变长，并且速度会慢慢变快。</p>
      </div>
    </div>

    <script>
      const COLS = 24;
      const ROWS = 24;
      const CELL = 20;
      const BASE_SPEED = 8;
      const MAX_SPEED = 15;

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const lengthEl = document.getElementById('length');
      const speedEl = document.getElementById('speed');
      const restartBtn = document.getElementById('restart');

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let gameOver;
      let paused;
      let lastTime;
      let stepTimer;
      let stepInterval;
      let frameId;

      function randomFood() {
        while (true) {
          const p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
          const occupied = snake.some((s) => s.x === p.x && s.y === p.y);
          if (!occupied) return p;
        }
      }

      function updateSpeed() {
        const speed = Math.min(MAX_SPEED, BASE_SPEED + Math.floor(score / 5));
        stepInterval = 1000 / speed;
        speedEl.textContent = String(speed);
      }

      function reset() {
        const cx = Math.floor(COLS / 2);
        const cy = Math.floor(ROWS / 2);
        snake = [{ x: cx, y: cy }];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        food = randomFood();
        score = 0;
        gameOver = false;
        paused = false;
        stepTimer = 0;
        lastTime = performance.now();
        updatePanel();
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(loop);
      }

      function updatePanel() {
        scoreEl.textContent = String(score);
        lengthEl.textContent = String(snake.length);
        updateSpeed();
      }

      function isReverse(a, b) {
        return a.x === -b.x && a.y === -b.y;
      }

      function setDirection(newDir) {
        if (gameOver) return;
        if (snake.length > 1 && isReverse(newDir, dir)) return;
        nextDir = newDir;
      }

      function step() {
        dir = nextDir;
        const head = snake[0];
        const nextHead = { x: head.x + dir.x, y: head.y + dir.y };

        if (nextHead.x < 0 || nextHead.x >= COLS || nextHead.y < 0 || nextHead.y >= ROWS) {
          gameOver = true;
          return;
        }

        const hitSelf = snake.some((part) => part.x === nextHead.x && part.y === nextHead.y);
        if (hitSelf) {
          gameOver = true;
          return;
        }

        snake.unshift(nextHead);

        if (nextHead.x === food.x && nextHead.y === food.y) {
          score += 1;
          food = randomFood();
          updatePanel();
        } else {
          snake.pop();
          lengthEl.textContent = String(snake.length);
        }
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      }

      function draw() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(100, 116, 139, 0.15)';
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * CELL, 0);
          ctx.lineTo(x * CELL, ROWS * CELL);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * CELL);
          ctx.lineTo(COLS * CELL, y * CELL);
          ctx.stroke();
        }

        snake.forEach((part, i) => {
          drawCell(part.x, part.y, i === 0 ? '#22d3ee' : '#14b8a6');
        });
        drawCell(food.x, food.y, '#f43f5e');

        if (paused && !gameOver) {
          drawOverlay('已暂停', '按 P 继续');
        }
        if (gameOver) {
          drawOverlay('游戏结束', '按 R 或点击“重新开始”');
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px system-ui';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '16px system-ui';
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 24);
      }

      function loop(ts) {
        const delta = ts - lastTime;
        lastTime = ts;

        if (!paused && !gameOver) {
          stepTimer += delta;
          while (stepTimer >= stepInterval) {
            step();
            stepTimer -= stepInterval;
            if (gameOver) break;
          }
        }

        draw();
        frameId = requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'arrowup') setDirection({ x: 0, y: -1 });
        else if (key === 'arrowdown') setDirection({ x: 0, y: 1 });
        else if (key === 'arrowleft') setDirection({ x: -1, y: 0 });
        else if (key === 'arrowright') setDirection({ x: 1, y: 0 });
        else if (key === 'p') paused = !paused;
        else if (key === 'r') reset();
      });

      restartBtn.addEventListener('click', reset);
      document.querySelectorAll('.controls button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'up') setDirection({ x: 0, y: -1 });
          if (action === 'down') setDirection({ x: 0, y: 1 });
          if (action === 'left') setDirection({ x: -1, y: 0 });
          if (action === 'right') setDirection({ x: 1, y: 0 });
          if (action === 'pause') paused = !paused;
          if (action === 'restart') reset();
        });
      });

      reset();
    </script>
  </body>
</html>
