<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>软萌贪吃蛇</title>
    <style>
      :root {
        color-scheme: light;
        --bg1: #ffdff0;
        --bg2: #dff7ff;
        --card: rgba(255, 255, 255, 0.78);
        --text: #5b4866;
        --strong: #ff8fbd;
        --soft: #9bc9ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #ffe9f4 0%, transparent 40%),
          radial-gradient(circle at 80% 25%, #dff4ff 0%, transparent 35%),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        color: var(--text);
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      }
      .game {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 18px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 16px 40px rgba(255, 163, 201, 0.3);
        backdrop-filter: blur(6px);
      }
      canvas {
        border: 4px solid #ffffff;
        border-radius: 20px;
        background: linear-gradient(180deg, #fef9ff, #fff7fb);
        box-shadow: inset 0 0 0 1px #ffd3e8;
      }
      .panel {
        width: 220px;
        background: rgba(255, 255, 255, 0.82);
        border-radius: 18px;
        padding: 12px;
        border: 1px dashed #ffb8d7;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 21px;
        color: #ff6ea9;
      }
      .info {
        margin-bottom: 8px;
        line-height: 1.5;
        font-size: 14px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }
      .chip {
        background: #fff;
        border-radius: 12px;
        padding: 6px 4px;
        text-align: center;
        border: 1px solid #ffd6ea;
      }
      .chip b { display: block; color: #ff75ad; }
      .kbd {
        display: inline-block;
        margin-right: 4px;
        margin-bottom: 4px;
        padding: 2px 7px;
        border: 1px solid #ffc0dd;
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 10px;
        font-weight: 700;
        color: white;
        background: linear-gradient(90deg, #ff9ec5, #ff7bb4);
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(255, 123, 180, 0.35);
      }
      .controls {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .controls button {
        padding: 8px;
        border-radius: 10px;
        background: linear-gradient(90deg, #9cc9ff, #8db8ff);
      }
      .hint {
        margin: 10px 0 2px;
        font-size: 13px;
        color: #7e6790;
      }
    </style>
  </head>
  <body>
    <div class="game">
      <canvas id="board" width="480" height="480"></canvas>
      <div class="panel">
        <h1>🍓 软萌贪吃蛇</h1>

        <div class="score-grid">
          <div class="chip"><small>分数</small><b id="score">0</b></div>
          <div class="chip"><small>长度</small><b id="length">1</b></div>
          <div class="chip"><small>速度</small><b><span id="speed">8</span>格</b></div>
        </div>

        <div class="info">
          <div><span class="kbd">↑↓←→</span> 控制方向</div>
          <div><span class="kbd">P</span> 暂停/继续</div>
          <div><span class="kbd">R</span> 重新开始</div>
        </div>

        <button id="restart">重新开始</button>
        <div class="controls">
          <button data-action="up">↑</button>
          <button data-action="pause">暂停</button>
          <button data-action="right">→</button>
          <button data-action="left">←</button>
          <button data-action="down">↓</button>
          <button data-action="restart">重开</button>
        </div>
        <p class="hint">吃掉小草莓会变长，速度也会慢慢变快 🍬</p>
      </div>
    </div>

    <script>
      const COLS = 24;
      const ROWS = 24;
      const CELL = 20;
      const BASE_SPEED = 8;
      const MAX_SPEED = 15;

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const lengthEl = document.getElementById('length');
      const speedEl = document.getElementById('speed');
      const restartBtn = document.getElementById('restart');

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let gameOver;
      let paused;
      let lastTime;
      let stepTimer;
      let stepInterval;
      let frameId;

      function randomFood() {
        while (true) {
          const p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
          const occupied = snake.some((s) => s.x === p.x && s.y === p.y);
          if (!occupied) return p;
        }
      }

      function updateSpeed() {
        const speed = Math.min(MAX_SPEED, BASE_SPEED + Math.floor(score / 5));
        stepInterval = 1000 / speed;
        speedEl.textContent = String(speed);
      }

      function reset() {
        const cx = Math.floor(COLS / 2);
        const cy = Math.floor(ROWS / 2);
        snake = [{ x: cx, y: cy }];
        dir = { x: 1, y: 0 };
        nextDir = { ...dir };
        food = randomFood();
        score = 0;
        gameOver = false;
        paused = false;
        stepTimer = 0;
        lastTime = performance.now();
        updatePanel();
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(loop);
      }

      function updatePanel() {
        scoreEl.textContent = String(score);
        lengthEl.textContent = String(snake.length);
        updateSpeed();
      }

      function isReverse(a, b) {
        return a.x === -b.x && a.y === -b.y;
      }

      function setDirection(newDir) {
        if (gameOver) return;
        if (snake.length > 1 && isReverse(newDir, dir)) return;
        nextDir = newDir;
      }

      function step() {
        dir = nextDir;
        const head = snake[0];
        const nextHead = { x: head.x + dir.x, y: head.y + dir.y };

        if (nextHead.x < 0 || nextHead.x >= COLS || nextHead.y < 0 || nextHead.y >= ROWS) {
          gameOver = true;
          return;
        }

        const hitSelf = snake.some((part) => part.x === nextHead.x && part.y === nextHead.y);
        if (hitSelf) {
          gameOver = true;
          return;
        }

        snake.unshift(nextHead);

        if (nextHead.x === food.x && nextHead.y === food.y) {
          score += 1;
          food = randomFood();
          updatePanel();
        } else {
          snake.pop();
          lengthEl.textContent = String(snake.length);
        }
      }

      function drawRoundCell(x, y, color, radius = 8) {
        const px = x * CELL + 2;
        const py = y * CELL + 2;
        const w = CELL - 4;
        const h = CELL - 4;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(px + radius, py);
        ctx.arcTo(px + w, py, px + w, py + h, radius);
        ctx.arcTo(px + w, py + h, px, py + h, radius);
        ctx.arcTo(px, py + h, px, py, radius);
        ctx.arcTo(px, py, px + w, py, radius);
        ctx.closePath();
        ctx.fill();
      }

      function drawFood(x, y) {
        const cx = x * CELL + CELL / 2;
        const cy = y * CELL + CELL / 2;
        ctx.fillStyle = '#ff6ea9';
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7ccb7c';
        ctx.beginPath();
        ctx.ellipse(cx + 3, cy - 7, 4, 2.5, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      function draw() {
        ctx.fillStyle = '#fff8fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255, 176, 212, 0.26)';
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * CELL, 0);
          ctx.lineTo(x * CELL, ROWS * CELL);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * CELL);
          ctx.lineTo(COLS * CELL, y * CELL);
          ctx.stroke();
        }

        snake.forEach((part, i) => {
          drawRoundCell(part.x, part.y, i === 0 ? '#ff88bc' : '#ffb5d5', i === 0 ? 9 : 7);
        });

        drawFood(food.x, food.y);

        if (paused && !gameOver) {
          drawOverlay('暂停中', '按 P 继续');
        }
        if (gameOver) {
          drawOverlay('撞到啦', '按 R 或点“重新开始”');
        }
      }

      function drawOverlay(title, subtitle) {
        ctx.fillStyle = 'rgba(255, 245, 251, 0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#a55f84';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px "PingFang SC", system-ui';
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '16px "PingFang SC", system-ui';
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 24);
      }

      function loop(ts) {
        const delta = ts - lastTime;
        lastTime = ts;

        if (!paused && !gameOver) {
          stepTimer += delta;
          while (stepTimer >= stepInterval) {
            step();
            stepTimer -= stepInterval;
            if (gameOver) break;
          }
        }

        draw();
        frameId = requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'arrowup') setDirection({ x: 0, y: -1 });
        else if (key === 'arrowdown') setDirection({ x: 0, y: 1 });
        else if (key === 'arrowleft') setDirection({ x: -1, y: 0 });
        else if (key === 'arrowright') setDirection({ x: 1, y: 0 });
        else if (key === 'p') paused = !paused;
        else if (key === 'r') reset();
      });

      restartBtn.addEventListener('click', reset);
      document.querySelectorAll('.controls button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          if (action === 'up') setDirection({ x: 0, y: -1 });
          if (action === 'down') setDirection({ x: 0, y: 1 });
          if (action === 'left') setDirection({ x: -1, y: 0 });
          if (action === 'right') setDirection({ x: 1, y: 0 });
          if (action === 'pause') paused = !paused;
          if (action === 'restart') reset();
        });
      });

      reset();
    </script>
  </body>
</html>
