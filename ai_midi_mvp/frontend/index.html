<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 扒谱 MVP</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 760px; line-height: 1.6; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
      button { padding: 0.6rem 1rem; border-radius: 8px; border: 0; background: #2563eb; color: white; cursor: pointer; }
      select,input { margin: 0.3rem 0; }
      pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 0.8rem; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>AI 扒谱（音频 -> MIDI）MVP</h1>
    <div class="card">
      <p>上传音频后，后端调用 Basic Pitch 并做轻量后处理（阈值 + 可选量化）。</p>
      <form id="form">
        <input type="file" name="audio" accept="audio/*" required />
        <br />
        <label>准确率策略：</label>
        <select name="profile">
          <option value="conservative">保守（更干净）</option>
          <option value="balanced" selected>平衡</option>
          <option value="aggressive">激进（更多音符）</option>
        </select>
        <br />
        <label>节拍吸附（秒，可空）：</label>
        <input type="number" name="snap_grid" step="0.01" placeholder="如 0.125" />
        <br /><br />
        <button type="submit">开始扒谱</button>
      </form>
    </div>

    <div class="card">
      <h3>结果</h3>
      <a id="download" style="display:none">下载 MIDI</a>
      <pre id="log">等待任务…</pre>
    </div>

    <script>
      const form = document.getElementById('form');
      const log = document.getElementById('log');
      const download = document.getElementById('download');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        log.textContent = '上传中...';
        download.style.display = 'none';

        const fd = new FormData(form);
        if (!fd.get('snap_grid')) fd.delete('snap_grid');

        const r = await fetch('http://127.0.0.1:8765/api/transcribe', {
          method: 'POST',
          body: fd,
        });
        const data = await r.json();

        if (!r.ok) {
          log.textContent = '失败：' + JSON.stringify(data, null, 2);
          return;
        }

        log.textContent = JSON.stringify(data, null, 2);
        download.href = 'http://127.0.0.1:8765' + data.midi_url;
        download.textContent = '下载 MIDI';
        download.style.display = 'inline-block';
      });
    </script>
  </body>
</html>
